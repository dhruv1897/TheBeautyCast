{# Sticky header. Logo swaps automatically between themes via CSS. #}
<header class="header">
  <div class="header__in">
    <a class="logo" href="{{ url_for('main.index') }}" aria-label="{{ site.brand.name }} home">
      <img class="on-light" src="{{ url_for('static', filename='img/brand/logo-light-bg.svg') }}" alt="{{ site.brand.name }}">
      <img class="on-dark"  src="{{ url_for('static', filename='img/brand/logo-dark-bg.svg') }}"  alt="{{ site.brand.name }}">
    </a>

    <nav class="header__nav">
      {% for item in site.nav %}
        <a href="{{ item.url }}">{{ item.label }}</a>
      {% endfor %}
    </nav>

    <div class="header__actions">
      <button class="theme-toggle" data-theme-toggle type="button" aria-label="Switch colour theme">
        {# Sun shows in dark mode, moon shows in light mode #}
        <svg class="icon-sun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="4.5"/>
          <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/>
        </svg>
        <svg class="icon-moon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5z"/>
        </svg>
      </button>
      <a class="btn btn--primary btn--sm" href="{{ url_for('main.brands_page') }}">Work with us</a>
    </div>
  </div>
</header>
