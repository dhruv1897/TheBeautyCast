{# Sticky header. Logo swaps automatically between themes via CSS. #}
<header class="header">
  <div class="header__in">
    <a class="logo" href="{{ url_for('main.index') }}" aria-label="{{ site.brand.name }} home">
      <img src="{{ url_for('static', filename='img/brand/logo-light-bg.svg') }}" alt="{{ site.brand.name }}">
    </a>

    <nav class="header__nav">
      {% for item in site.nav %}
        <a href="{{ item.url }}">{{ item.label }}</a>
      {% endfor %}
    </nav>

    <div class="header__actions">
      <a class="btn btn--primary btn--sm" href="{{ url_for('main.brands_page') }}">Work with us</a>
    </div>
  </div>
</header>
